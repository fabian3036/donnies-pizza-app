<style>
  :root{
    --rojo: #B21829;
    --rojo-dark: #E2394A;
    --blanco: #FFFFFF;
    --gris: #F5F1EE;
    --texto: #241414;
    --card: #FFFFFF;
    --borde: #EAD9D9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gris);color:var(--texto);transition:background .2s,color .2s;}
  #root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--gris);}
  .header{padding:18px 20px 12px;position:sticky;top:0;background:var(--gris);z-index:5;}
  .header h1{font-size:22px;margin:0;letter-spacing:-0.02em;font-weight:800;}
  .header .sub{font-size:13px;opacity:.6;margin-top:2px;}
  .content{flex:1;padding:0 16px 90px;overflow-y:auto;}
  .card{background:var(--card);border:1px solid var(--borde);border-radius:16px;padding:16px;margin-bottom:14px;}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.03em;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card);border:1px solid var(--borde);border-radius:14px;padding:14px;}
  .stat .num{font-size:22px;font-weight:800;color:var(--rojo);}
  .stat .lbl{font-size:12px;opacity:.65;margin-top:2px;}
  .stat .delta{font-size:12px;font-weight:700;margin-top:4px;}
  .delta.up{color:#1e8e3e;} .delta.down{color:var(--rojo);}
  select,input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--borde);background:var(--blanco);color:var(--texto);font-size:15px;margin-bottom:10px;}
  label{font-size:12px;font-weight:700;opacity:.7;display:block;margin-bottom:4px;}
  button.primary{width:100%;padding:13px;border:none;border-radius:12px;background:var(--rojo);color:#fff;font-weight:800;font-size:15px;}
  button.primary:active{background:var(--rojo-dark);}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--borde);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row-main{flex:1; cursor:pointer;}
  .row-actions{display:flex;gap:10px;align-items:center;}
  .icon-btn{background:none;border:none;font-size:16px;padding:2px 4px;cursor:pointer;opacity:.7;}
  .icon-btn:active{opacity:1;}
  .edit-box{background:var(--gris);border:1px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:10px;}
  .edit-box .actions-row{display:flex;gap:10px;}
  .edit-box .actions-row button{flex:1;}
  button.secondary{background:#8a8a8a;}
  button.danger{background:#7a1010;}
  .seg{display:flex;background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:4px;margin-bottom:14px;}
  .seg button{flex:1;background:none;border:none;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:700;color:var(--texto);opacity:.55;}
  .seg button.active{background:var(--rojo);color:#fff;opacity:1;}
  .status-tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .status-tag.ok{background:#1e8e3e;color:#fff;}
  .status-tag.warn{background:#c98a12;color:#fff;}
  .status-tag.danger{background:var(--rojo);color:#fff;}
  .ticket-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
  .ticket-box{background:#fff;color:#000;border-radius:12px;padding:20px;width:100%;max-width:340px;}
  .ticket-print{font-family:monospace;}
  .ticket-print h2{text-align:center;margin:0 0 4px;font-size:18px;}
  .ticket-sub{text-align:center;font-size:12px;margin-bottom:12px;}
  .ticket-line{border-top:1px dashed #000;margin:10px 0;}
  .ticket-row{display:flex;justify-content:space-between;font-size:14px;margin:4px 0;}
  .ticket-total{font-size:22px;font-weight:bold;text-align:center;margin:14px 0;}
  .ticket-box .actions-row{margin-top:16px;}
  @media print{
    body *{visibility:hidden;}
    .ticket-print, .ticket-print *{visibility:visible;}
    .ticket-print{position:absolute;top:0;left:0;width:100%;}
    .ticket-overlay, .ticket-box{position:static;background:none;padding:0;box-shadow:none;}
    .no-print{display:none;}
  }
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--rojo);color:#fff;opacity:.9;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .bar-track{flex:1;background:var(--borde);border-radius:6px;height:10px;overflow:hidden;}
  .bar-fill{background:var(--rojo);height:100%;border-radius:6px;}
  .bar-label{width:38px;font-size:11px;opacity:.7;text-align:right;}
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--borde);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--texto);opacity:.5;font-size:11px;font-weight:700;padding:6px 0;}
  nav button.active{opacity:1;color:var(--rojo);}
  .empty{text-align:center;padding:30px 10px;opacity:.5;font-size:13px;}
  .logo-wrap{display:flex;justify-content:center;padding:6px 0 2px;}
  .logo-wrap img{max-width:180px;height:auto;display:block;}
  .pin-display{font-size:20px;font-weight:800;letter-spacing:4px;color:var(--rojo);}
</style>

const {useState, useMemo, useEffect, useRef} = React;

// ---------- Firebase (sincroniza los datos entre todos los dispositivos) ----------
const firebaseConfig = {
  apiKey: "AIzaSyBqqltdwJLkArC4-XI9_aUtYDgYmX6fCtE",
  authDomain: "donnies-pizza-app.firebaseapp.com",
  projectId: "donnies-pizza-app",
  storageBucket: "donnies-pizza-app.firebasestorage.app",
  messagingSenderId: "733555892655",
  appId: "1:733555892655:web:946d0c70054f5037238f5a",
  measurementId: "G-ND748DX2EL"
};
let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  // Habilita caché local: la app sigue funcionando sin internet y sincroniza
  // automáticamente en cuanto vuelve la conexión.
  db.enablePersistence({synchronizeTabs: true}).catch(() => {});
} catch (e) {
  db = null; // si Firebase no carga (p. ej. sin internet en la primera visita), se sigue con el respaldo local
}

// ---------- Almacenamiento local con respaldo en memoria ----------
// Usa localStorage cuando está disponible (app instalada / GitHub Pages) para
// que los datos sobrevivan al cerrar la app y funcionen sin internet.
// Si localStorage no está disponible (p. ej. vista previa en un entorno restringido),
// cae automáticamente a un respaldo en memoria para que la app no se rompa.
const memoryFallback = {};
const store = {
  get(key, fallback){
    try {
      const raw = localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : fallback;
    } catch(e){
      return memoryFallback[key] !== undefined ? memoryFallback[key] : fallback;
    }
  },
  set(key, value){
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch(e){
      memoryFallback[key] = value;
    }
  }
};
function usePersistentState(key, initial){
  // Arranca con lo que haya en el respaldo local (para que la app cargue
  // instantáneo y funcione sin internet), y en cuanto Firestore responde,
  // se sincroniza con lo que haya en la nube (compartido entre dispositivos).
  const [value, setValue] = useState(() => store.get(key, initial));
  const readyRef = useRef(false);
  const skipWriteRef = useRef(false);

  useEffect(() => {
    if(!db){ readyRef.current = true; return; }
    const ref = db.collection('donnies_pizza_app').doc(key);
    const unsub = ref.onSnapshot(
      (snap) => {
        skipWriteRef.current = true;
        if(snap.exists && snap.data().value !== undefined){
          setValue(snap.data().value);
        } else {
          ref.set({value: store.get(key, initial)}).catch(() => {});
        }
        readyRef.current = true;
      },
      () => { readyRef.current = true; } // sin conexión: se sigue con el respaldo local
    );
    return () => unsub();
  }, [key]);

  useEffect(() => {
    store.set(key, value); // respaldo local siempre, incluso sin internet
    if(!readyRef.current) return;
    if(skipWriteRef.current){ skipWriteRef.current = false; return; }
    if(db){
      db.collection('donnies_pizza_app').doc(key).set({value}).catch(() => {});
    }
  }, [value]);

  return [value, setValue];
}

// ---------- Config editable ----------
// Canales de venta manual (sin inventario ni productos: solo monto total por canal)
const CANALES = [
  {id:'didi', label:'Didi Food'},
  {id:'uber', label:'Uber Eats'},
  {id:'rappi', label:'Rappi'},
  {id:'sucursal', label:'Venta en sucursal'},
  {id:'llevar', label:'Pedidos para llevar'},
];
// Canales donde se cobra directamente (los de delivery ya traen su propio pago resuelto)
// El método de pago ahora aplica a todos los canales de venta
const CANALES_CON_PAGO = CANALES.map(c => c.id);
const METODOS_PAGO = [
  {id:'efectivo', label:'Efectivo'},
  {id:'debito', label:'Débito'},
  {id:'credito', label:'Crédito'},
];

function todayISO(d=new Date()){ return d.toISOString().slice(0,10); }
function fmt(n){ return '$' + Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0}); }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }

function App(){
  const [tab, setTab] = useState('ventas');
  const [adminPin, setAdminPin] = usePersistentState('donnies_admin_pin', '1234');
  const [unlocked, setUnlocked] = useState(false);
  const [ventas, setVentas] = usePersistentState('donnies_ventas', []); // {id, canal, monto, fecha(ISO date), hora(0-23), nota}
  const [cierres, setCierres] = usePersistentState('donnies_cierres', []); // cierres de caja
  const [costos, setCostos] = usePersistentState('donnies_costos', []);
  const [gastos, setGastos] = usePersistentState('donnies_gastos', []);
  const [inventario, setInventario] = usePersistentState('donnies_inventario', []); // {id, nombre, actual, minimo, maximo}

  // ---- formulario venta ----
  const [canal, setCanal] = useState(CANALES[0].id);
  const [monto, setMonto] = useState('');
  const [nota, setNota] = useState('');
  const [metodoPago, setMetodoPago] = useState('efectivo');

  function agregarVenta(e){
    e.preventDefault();
    if(!monto || Number(monto) <= 0) return;
    const now = new Date();
    const item = {
      id: Date.now(),
      canal, monto: Number(monto), nota,
      fecha: todayISO(now), hora: now.getHours()
    };
    if(canal === 'sucursal' || canal === 'llevar') item.metodoPago = metodoPago;
    setVentas(v => [...v, item]);
    setMonto(''); setNota('');
  }

  // ---- métricas ----
  const metrics = useMemo(()=>{
    const now = new Date();
    const hoy = todayISO(now);
    const semanaIni = startOfWeek(now);
    const semanaPasadaIni = new Date(semanaIni); semanaPasadaIni.setDate(semanaPasadaIni.getDate()-7);
    const mesIni = new Date(now.getFullYear(), now.getMonth(), 1);

    let totalHoy=0, totalSemana=0, totalSemanaPasada=0, totalMes=0;
    const porHora = Array(24).fill(0);
    const porCanalHoy = {};

    ventas.forEach(v=>{
      const f = new Date(v.fecha+'T00:00:00');
      if(v.fecha === hoy){ totalHoy += v.monto; porCanalHoy[v.canal] = (porCanalHoy[v.canal]||0)+v.monto; porHora[v.hora]+=v.monto; }
      if(f >= semanaIni) totalSemana += v.monto;
      if(f >= semanaPasadaIni && f < semanaIni) totalSemanaPasada += v.monto;
      if(f >= mesIni) totalMes += v.monto;
    });

    let horaPico = 0;
    porHora.forEach((val,h)=>{ if(val > porHora[horaPico]) horaPico = h; });
    const maxHora = Math.max(...porHora, 1);

    const deltaSemana = totalSemanaPasada > 0 ? Math.round(((totalSemana-totalSemanaPasada)/totalSemanaPasada)*100) : null;

    return {totalHoy, totalSemana, totalSemanaPasada, totalMes, porHora, horaPico, maxHora, porCanalHoy, deltaSemana};
  }, [ventas]);

  if(!unlocked){
    return <Lock adminPin={adminPin} onUnlock={()=>setUnlocked(true)} />;
  }

  return (
    <div>
      <div className="header">
        <div className="logo-wrap"><img src={LOGO_SRC} alt="Donnie's Pizza" /></div>
        <div className="sub" style={{textAlign:'center'}}>{tab==='ventas' ? 'Registro y análisis de ventas' : tab==='mas' ? 'Cierres, costos y gastos' : 'Configuración'}</div>
      </div>

      <div className="content">
        {tab === 'ventas' && <Ventas
          canal={canal} setCanal={setCanal} monto={monto} setMonto={setMonto}
          nota={nota} setNota={setNota} metodoPago={metodoPago} setMetodoPago={setMetodoPago}
          agregarVenta={agregarVenta}
          ventas={ventas} setVentas={setVentas} metrics={metrics}
        />}
        {tab === 'mas' && <Mas cierres={cierres} setCierres={setCierres} costos={costos} setCostos={setCostos} gastos={gastos} setGastos={setGastos} inventario={inventario} setInventario={setInventario} metrics={metrics} />}
        {tab === 'config' && <Config adminPin={adminPin} setAdminPin={setAdminPin} onLock={()=>setUnlocked(false)} />}
      </div>

      <nav>
        <button className={tab==='ventas'?'active':''} onClick={()=>setTab('ventas')}>
          <span>💰</span>Ventas
        </button>
        <button className={tab==='mas'?'active':''} onClick={()=>setTab('mas')}>
          <span>➕</span>Más
        </button>
        <button className={tab==='config'?'active':''} onClick={()=>setTab('config')}>
          <span>⚙️</span>Configuración
        </button>
      </nav>
    </div>
  );
}

function Ventas({canal, setCanal, monto, setMonto, nota, setNota, metodoPago, setMetodoPago, agregarVenta, ventas, setVentas, metrics}){
  const hoy = todayISO();
  const ventasHoy = ventas.filter(v=>v.fecha===hoy).sort((a,b)=>b.id-a.id);

  const [editId, setEditId] = useState(null);
  const [editCanal, setEditCanal] = useState('');
  const [editMonto, setEditMonto] = useState('');
  const [editNota, setEditNota] = useState('');
  const [editMetodoPago, setEditMetodoPago] = useState('efectivo');

  function empezarEdicion(v){
    setEditId(v.id);
    setEditCanal(v.canal);
    setEditMonto(String(v.monto));
    setEditNota(v.nota || '');
    setEditMetodoPago(v.metodoPago || 'efectivo');
  }

  function cancelarEdicion(){
    setEditId(null);
  }

  function guardarEdicion(e){
    e.preventDefault();
    if(!editMonto || Number(editMonto) <= 0) return;
    setVentas(vs => vs.map(v => v.id === editId
      ? {...v, canal: editCanal, monto: Number(editMonto), nota: editNota,
         ...(CANALES_CON_PAGO.includes(editCanal) ? {metodoPago: editMetodoPago} : {metodoPago: undefined})}
      : v
    ));
    setEditId(null);
  }

  function eliminarVenta(id){
    if(confirm('¿Eliminar esta venta?')){
      setVentas(vs => vs.filter(v => v.id !== id));
      if(editId === id) setEditId(null);
    }
  }

  return (<>
    <div className="card">
      <h3>Registrar venta</h3>
      <form onSubmit={agregarVenta}>
        <label>Canal</label>
        <select value={canal} onChange={e=>setCanal(e.target.value)}>
          {CANALES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
        </select>
        {CANALES_CON_PAGO.includes(canal) && (<>
          <label>Método de pago</label>
          <select value={metodoPago} onChange={e=>setMetodoPago(e.target.value)}>
            {METODOS_PAGO.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
          </select>
        </>)}
        <label>Monto total</label>
        <input type="number" inputMode="decimal" placeholder="0.00" value={monto} onChange={e=>setMonto(e.target.value)} />
        <label>Nota (opcional)</label>
        <input type="text" placeholder="Ej. 3 pedidos" value={nota} onChange={e=>setNota(e.target.value)} />
        <button className="primary" type="submit">Agregar venta</button>
      </form>
    </div>

    <div className="stat-grid">
      <div className="stat"><div className="num">{fmt(metrics.totalHoy)}</div><div className="lbl">Ventas hoy</div></div>
      <div className="stat"><div className="num">{fmt(metrics.totalSemana)}</div><div className="lbl">Esta semana</div></div>
      <div className="stat"><div className="num">{fmt(metrics.totalMes)}</div><div className="lbl">Este mes</div></div>
      <div className="stat">
        <div className="num">{fmt(metrics.totalSemanaPasada)}</div>
        <div className="lbl">Semana pasada</div>
        {metrics.deltaSemana !== null && (
          <div className={"delta " + (metrics.deltaSemana>=0?'up':'down')}>
            {metrics.deltaSemana>=0?'▲':'▼'} {Math.abs(metrics.deltaSemana)}% vs. esta semana
          </div>
        )}
      </div>
    </div>

    <div className="card">
      <h3>Hora pico de ventas (hoy)</h3>
      {metrics.totalHoy === 0 ? <div className="empty">Aún no hay ventas registradas hoy</div> :
        <div>
          <div style={{fontSize:13, marginBottom:8}}>Pico: <b>{metrics.horaPico}:00 – {metrics.horaPico+1}:00</b></div>
          {metrics.porHora.map((val,h)=> val>0 && (
            <div className="bar-row" key={h}>
              <div className="bar-label">{h}:00</div>
              <div className="bar-track"><div className="bar-fill" style={{width:(val/metrics.maxHora*100)+'%'}}></div></div>
            </div>
          ))}
        </div>
      }
    </div>

    <div className="card">
      <h3>Ventas de hoy por canal</h3>
      {CANALES.map(c => (
        <div className="row" key={c.id}>
          <span>{c.label}</span>
          <span><b>{fmt(metrics.porCanalHoy[c.id]||0)}</b></span>
        </div>
      ))}
    </div>

    <div className="card">
      <h3>Movimientos de hoy</h3>
      {ventasHoy.length===0 ? <div className="empty">Sin movimientos aún</div> :
        ventasHoy.map(v => editId === v.id ? (
          <div className="edit-box" key={v.id}>
            <form onSubmit={guardarEdicion}>
              <label>Canal</label>
              <select value={editCanal} onChange={e=>setEditCanal(e.target.value)}>
                {CANALES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
              </select>
              {CANALES_CON_PAGO.includes(editCanal) && (<>
                <label>Método de pago</label>
                <select value={editMetodoPago} onChange={e=>setEditMetodoPago(e.target.value)}>
                  {METODOS_PAGO.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                </select>
              </>)}
              <label>Monto total</label>
              <input type="number" inputMode="decimal" value={editMonto} onChange={e=>setEditMonto(e.target.value)} />
              <label>Nota (opcional)</label>
              <input type="text" value={editNota} onChange={e=>setEditNota(e.target.value)} />
              <div className="actions-row">
                <button className="primary secondary" type="button" onClick={cancelarEdicion}>Cancelar</button>
                <button className="primary danger" type="button" onClick={()=>eliminarVenta(v.id)}>Eliminar</button>
                <button className="primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        ) : (
          <div className="row" key={v.id}>
            <span className="row-main" onClick={()=>empezarEdicion(v)}>
              <span className="tag">{CANALES.find(c=>c.id===v.canal)?.label}</span>
              {v.metodoPago && <span className="tag" style={{background:'#555'}}>{METODOS_PAGO.find(m=>m.id===v.metodoPago)?.label}</span>}
              {v.nota && <span style={{opacity:.6}}> · {v.nota}</span>}
            </span>
            <span className="row-actions">
              <b>{fmt(v.monto)}</b>
              <button className="icon-btn" onClick={()=>empezarEdicion(v)}>✏️</button>
              <button className="icon-btn" onClick={()=>eliminarVenta(v.id)}>🗑️</button>
            </span>
          </div>
        ))
      }
    </div>
  </>);
}

function Mas({cierres, setCierres, costos, setCostos, gastos, setGastos, inventario, setInventario, metrics}){
  const [vista, setVista] = useState('registros'); // 'registros' | 'inventario'
  const [seccion, setSeccion] = useState('cierre');
  const [monto, setMonto] = useState('');
  const [desc, setDesc] = useState('');
  const [categoria, setCategoria] = useState('general');

  const [editKey, setEditKey] = useState(null); // {tipo, id}
  const [editMonto, setEditMonto] = useState('');
  const [editDesc, setEditDesc] = useState('');
  const [editCategoria, setEditCategoria] = useState('general');

  const CATEGORIAS_GASTO = [
    {id:'general', label:'General'},
    {id:'retiro', label:'Retiro de caja'},
    {id:'transferencia', label:'Transferencia'},
    {id:'tarjeta', label:'Tarjeta'},
  ];

  // ---- comparativo de cierres: este mes vs. mes pasado ----
  const cierresMetrics = useMemo(() => {
    const now = new Date();
    const mesIni = new Date(now.getFullYear(), now.getMonth(), 1);
    const mesPasadoIni = new Date(now.getFullYear(), now.getMonth()-1, 1);
    let totalMes = 0, totalMesPasado = 0;
    cierres.forEach(c => {
      const f = new Date(c.fecha+'T00:00:00');
      if(f >= mesIni) totalMes += c.monto;
      else if(f >= mesPasadoIni && f < mesIni) totalMesPasado += c.monto;
    });
    const delta = totalMesPasado > 0 ? Math.round(((totalMes-totalMesPasado)/totalMesPasado)*100) : null;
    return {totalMes, totalMesPasado, delta};
  }, [cierres]);

  const [ticketPreview, setTicketPreview] = useState(null);

  function imprimirTicket(it){
    setTicketPreview(it);
  }

  function agregar(e){
    e.preventDefault();
    if(!monto) return;
    const item = {id:Date.now(), monto:Number(monto), desc, fecha: todayISO()};
    if(seccion==='gasto') item.categoria = categoria;
    if(seccion==='cierre') setCierres(x=>[item,...x]);
    if(seccion==='costo') setCostos(x=>[item,...x]);
    if(seccion==='gasto') setGastos(x=>[item,...x]);
    setMonto(''); setDesc(''); setCategoria('general');
    if(seccion==='cierre') imprimirTicket(item);
  }

  const listas = {cierre: cierres, costo: costos, gasto: gastos};
  const setters = {cierre: setCierres, costo: setCostos, gasto: setGastos};
  const titulos = {cierre:'Cierre de caja', costo:'Costo', gasto:'Gasto'};

  function empezarEdicion(tipo, it){
    setEditKey({tipo, id: it.id});
    setEditMonto(String(it.monto));
    setEditDesc(it.desc || '');
    setEditCategoria(it.categoria || 'general');
  }

  function cancelarEdicion(){
    setEditKey(null);
  }

  function guardarEdicion(e){
    e.preventDefault();
    if(!editMonto) return;
    const {tipo, id} = editKey;
    setters[tipo](xs => xs.map(it => it.id === id
      ? {...it, monto:Number(editMonto), desc: editDesc, ...(tipo==='gasto' ? {categoria: editCategoria} : {})}
      : it
    ));
    setEditKey(null);
  }

  function eliminar(tipo, id){
    if(confirm('¿Eliminar este registro?')){
      setters[tipo](xs => xs.filter(it => it.id !== id));
      if(editKey && editKey.tipo===tipo && editKey.id===id) setEditKey(null);
    }
  }

  return (<>
    <div className="seg">
      <button className={vista==='registros'?'active':''} onClick={()=>setVista('registros')}>Cierres / Costos / Gastos</button>
      <button className={vista==='inventario'?'active':''} onClick={()=>setVista('inventario')}>Inventario</button>
    </div>

    {vista === 'inventario' && <Inventario inventario={inventario} setInventario={setInventario} />}

    {vista === 'registros' && (<>
    <div className="stat-grid">
      <div className="stat"><div className="num">{fmt(cierresMetrics.totalMes)}</div><div className="lbl">Cierres este mes</div></div>
      <div className="stat">
        <div className="num">{fmt(cierresMetrics.totalMesPasado)}</div>
        <div className="lbl">Mes pasado</div>
        {cierresMetrics.delta !== null && (
          <div className={"delta " + (cierresMetrics.delta>=0?'up':'down')}>
            {cierresMetrics.delta>=0?'▲':'▼'} {Math.abs(cierresMetrics.delta)}% vs. este mes
          </div>
        )}
      </div>
    </div>

    <div className="card">
      <h3>Agregar registro</h3>
      <label>Tipo</label>
      <select value={seccion} onChange={e=>setSeccion(e.target.value)}>
        <option value="cierre">Cierre de caja</option>
        <option value="costo">Costo</option>
        <option value="gasto">Gasto</option>
      </select>
      <form onSubmit={agregar}>
        {seccion === 'gasto' && (<>
          <label>Categoría de gasto</label>
          <select value={categoria} onChange={e=>setCategoria(e.target.value)}>
            {CATEGORIAS_GASTO.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
        </>)}
        <label>Monto</label>
        <input type="number" inputMode="decimal" value={monto} onChange={e=>setMonto(e.target.value)} />
        <label>Descripción</label>
        <input type="text" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Ej. compra de gas, corte de turno..." />
        <button className="primary" type="submit">Guardar {titulos[seccion].toLowerCase()}</button>
      </form>
    </div>

    {['cierre','costo','gasto'].map(tipo=>(
      <div className="card" key={tipo}>
        <h3>{titulos[tipo]}s recientes</h3>
        {listas[tipo].length===0 ? <div className="empty">Sin registros</div> :
          listas[tipo].slice(0,8).map(it => (editKey && editKey.tipo===tipo && editKey.id===it.id) ? (
            <div className="edit-box" key={it.id}>
              <form onSubmit={guardarEdicion}>
                {tipo === 'gasto' && (<>
                  <label>Categoría de gasto</label>
                  <select value={editCategoria} onChange={e=>setEditCategoria(e.target.value)}>
                    {CATEGORIAS_GASTO.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                  </select>
                </>)}
                <label>Monto</label>
                <input type="number" inputMode="decimal" value={editMonto} onChange={e=>setEditMonto(e.target.value)} />
                <label>Descripción</label>
                <input type="text" value={editDesc} onChange={e=>setEditDesc(e.target.value)} />
                <div className="actions-row">
                  <button className="primary secondary" type="button" onClick={cancelarEdicion}>Cancelar</button>
                  <button className="primary danger" type="button" onClick={()=>eliminar(tipo, it.id)}>Eliminar</button>
                  <button className="primary" type="submit">Guardar</button>
                </div>
              </form>
            </div>
          ) : (
            <div className="row" key={it.id}>
              <span className="row-main" onClick={()=>empezarEdicion(tipo, it)}>
                {tipo==='gasto' && it.categoria && it.categoria!=='general' && (
                  <span className="tag">{CATEGORIAS_GASTO.find(c=>c.id===it.categoria)?.label}</span>
                )} {it.desc || '—'} <span style={{opacity:.5}}> · {it.fecha}</span>
              </span>
              <span className="row-actions">
                <b>{fmt(it.monto)}</b>
                {tipo === 'cierre' && <button className="icon-btn" onClick={()=>imprimirTicket(it)}>🖨️</button>}
                <button className="icon-btn" onClick={()=>empezarEdicion(tipo, it)}>✏️</button>
                <button className="icon-btn" onClick={()=>eliminar(tipo, it.id)}>🗑️</button>
              </span>
            </div>
          ))
        }
      </div>
    ))}
    </>)}

    {ticketPreview && <TicketModal it={ticketPreview} onClose={()=>setTicketPreview(null)} />}
  </>);
}

function TicketModal({it, onClose}){
  const fechaHora = new Date(it.id).toLocaleString('es-MX');

  async function compartir(){
    const texto = "Donnie's Pizza\nTicket de cierre de caja\n\n" +
      "Fecha: " + it.fecha + "\n" +
      "Registrado: " + fechaHora + "\n" +
      "Descripción: " + (it.desc || '—') + "\n\n" +
      "Total: " + fmt(it.monto) + "\n\nGracias";
    if(navigator.share){
      try { await navigator.share({title: 'Ticket de cierre de caja', text: texto}); }
      catch(e){ /* el usuario canceló el compartir, no pasa nada */ }
    } else if(navigator.clipboard){
      try {
        await navigator.clipboard.writeText(texto);
        alert('No se pudo abrir el menú de compartir, así que copiamos el ticket. Pégalo donde quieras imprimirlo.');
      } catch(e){ alert(texto); }
    } else {
      alert(texto);
    }
  }

  return (
    <div className="ticket-overlay">
      <div className="ticket-box">
        <div className="ticket-print">
          <h2>Donnie's Pizza</h2>
          <div className="ticket-sub">Ticket de cierre de caja</div>
          <div className="ticket-line"></div>
          <div className="ticket-row"><span>Fecha</span><span>{it.fecha}</span></div>
          <div className="ticket-row"><span>Registrado</span><span>{fechaHora}</span></div>
          <div className="ticket-row"><span>Descripción</span><span>{it.desc || '—'}</span></div>
          <div className="ticket-line"></div>
          <div className="ticket-total">{fmt(it.monto)}</div>
          <div className="ticket-line"></div>
          <div className="ticket-sub">Gracias</div>
        </div>
        <div className="actions-row no-print">
          <button className="primary secondary" onClick={onClose}>Cerrar</button>
          <button className="primary" onClick={compartir}>Compartir / Imprimir</button>
        </div>
      </div>
    </div>
  );
}

function Inventario({inventario, setInventario}){
  const [nombre, setNombre] = useState('');
  const [actual, setActual] = useState('');
  const [minimo, setMinimo] = useState('');
  const [maximo, setMaximo] = useState('');

  const [editId, setEditId] = useState(null);
  const [eNombre, setENombre] = useState('');
  const [eActual, setEActual] = useState('');
  const [eMinimo, setEMinimo] = useState('');
  const [eMaximo, setEMaximo] = useState('');

  function agregar(e){
    e.preventDefault();
    if(!nombre || actual==='' || minimo==='' || maximo==='') return;
    setInventario(xs => [...xs, {
      id: Date.now(), nombre,
      actual: Number(actual), minimo: Number(minimo), maximo: Number(maximo)
    }]);
    setNombre(''); setActual(''); setMinimo(''); setMaximo('');
  }

  function empezarEdicion(it){
    setEditId(it.id);
    setENombre(it.nombre); setEActual(String(it.actual));
    setEMinimo(String(it.minimo)); setEMaximo(String(it.maximo));
  }

  function cancelarEdicion(){ setEditId(null); }

  function guardarEdicion(e){
    e.preventDefault();
    setInventario(xs => xs.map(it => it.id === editId
      ? {...it, nombre: eNombre, actual:Number(eActual), minimo:Number(eMinimo), maximo:Number(eMaximo)}
      : it
    ));
    setEditId(null);
  }

  function eliminar(id){
    if(confirm('¿Eliminar este producto del inventario?')){
      setInventario(xs => xs.filter(it => it.id !== id));
      if(editId === id) setEditId(null);
    }
  }

  function estado(it){
    if(it.actual < it.minimo) return {label:'Bajo mínimo', cls:'danger'};
    if(it.actual > it.maximo) return {label:'Sobre máximo', cls:'warn'};
    return {label:'OK', cls:'ok'};
  }

  return (<>
    <div className="card">
      <h3>Agregar producto</h3>
      <form onSubmit={agregar}>
        <label>Nombre del producto/insumo</label>
        <input type="text" value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Ej. Queso mozzarella (kg)" />
        <label>Cantidad actual</label>
        <input type="number" inputMode="decimal" value={actual} onChange={e=>setActual(e.target.value)} />
        <label>Mínimo</label>
        <input type="number" inputMode="decimal" value={minimo} onChange={e=>setMinimo(e.target.value)} />
        <label>Máximo</label>
        <input type="number" inputMode="decimal" value={maximo} onChange={e=>setMaximo(e.target.value)} />
        <button className="primary" type="submit">Agregar al inventario</button>
      </form>
    </div>

    <div className="card">
      <h3>Inventario</h3>
      {inventario.length===0 ? <div className="empty">Sin productos aún</div> :
        inventario.map(it => editId===it.id ? (
          <div className="edit-box" key={it.id}>
            <form onSubmit={guardarEdicion}>
              <label>Nombre</label>
              <input type="text" value={eNombre} onChange={e=>setENombre(e.target.value)} />
              <label>Cantidad actual</label>
              <input type="number" inputMode="decimal" value={eActual} onChange={e=>setEActual(e.target.value)} />
              <label>Mínimo</label>
              <input type="number" inputMode="decimal" value={eMinimo} onChange={e=>setEMinimo(e.target.value)} />
              <label>Máximo</label>
              <input type="number" inputMode="decimal" value={eMaximo} onChange={e=>setEMaximo(e.target.value)} />
              <div className="actions-row">
                <button className="primary secondary" type="button" onClick={cancelarEdicion}>Cancelar</button>
                <button className="primary danger" type="button" onClick={()=>eliminar(it.id)}>Eliminar</button>
                <button className="primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        ) : (
          <div className="row" key={it.id} onClick={()=>empezarEdicion(it)}>
            <div className="row-main">
              <div>{it.nombre}</div>
              <div style={{fontSize:12, opacity:.6}}>Actual: {it.actual} · Mín: {it.minimo} · Máx: {it.maximo}</div>
            </div>
            <span className="row-actions">
              <span className={"status-tag " + estado(it).cls}>{estado(it).label}</span>
              <button className="icon-btn" onClick={(e)=>{e.stopPropagation(); eliminar(it.id);}}>🗑️</button>
            </span>
          </div>
        ))
      }
    </div>
  </>);
}

function Lock({adminPin, onUnlock}){
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');

  function intentar(e){
    e.preventDefault();
    if(pin === adminPin){
      setError('');
      setPin('');
      onUnlock();
    } else {
      setError('NIP incorrecto.');
      setPin('');
    }
  }

  return (
    <div style={{maxWidth:480, margin:'0 auto', minHeight:'100vh', display:'flex', flexDirection:'column', justifyContent:'center', padding:'0 24px'}}>
      <div className="logo-wrap" style={{marginBottom:24}}><img src={LOGO_SRC} alt="Donnie's Pizza" /></div>
      <div className="card">
        <h3>Acceso de administrador</h3>
        <form onSubmit={intentar}>
          <label>Ingresa tu NIP</label>
          <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength="6" autoFocus
            value={pin} onChange={e=>{setPin(e.target.value.replace(/\D/g,'')); setError('');}} />
          {error && <div style={{color:'var(--rojo)', fontSize:13, marginBottom:10}}>{error}</div>}
          <button className="primary" type="submit">Entrar</button>
        </form>
      </div>
    </div>
  );
}

function Config({adminPin, setAdminPin, onLock}){
  const [editando, setEditando] = useState(false);
  const [nuevoPin, setNuevoPin] = useState('');
  const [confirmaPin, setConfirmaPin] = useState('');
  const [mensaje, setMensaje] = useState('');

  function guardarPin(e){
    e.preventDefault();
    if(!/^\d{4,6}$/.test(nuevoPin)){
      setMensaje('El NIP debe tener entre 4 y 6 dígitos.');
      return;
    }
    if(nuevoPin !== confirmaPin){
      setMensaje('Los NIP no coinciden.');
      return;
    }
    setAdminPin(nuevoPin);
    setEditando(false);
    setNuevoPin(''); setConfirmaPin('');
    setMensaje('');
  }

  return (<>
    <div className="card">
      <h3>NIP de administrador</h3>
      {!editando ? (
        <>
          <div className="row">
            <span>NIP actual</span>
            <span className="pin-display">{'•'.repeat(adminPin.length)}</span>
          </div>
          <button className="primary" onClick={()=>setEditando(true)}>Cambiar NIP</button>
        </>
      ) : (
        <form onSubmit={guardarPin}>
          <label>Nuevo NIP (4 a 6 dígitos)</label>
          <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength="6"
            value={nuevoPin} onChange={e=>setNuevoPin(e.target.value.replace(/\D/g,''))} />
          <label>Confirmar NIP</label>
          <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength="6"
            value={confirmaPin} onChange={e=>setConfirmaPin(e.target.value.replace(/\D/g,''))} />
          {mensaje && <div style={{color:'var(--rojo)', fontSize:13, marginBottom:10}}>{mensaje}</div>}
          <button className="primary" type="submit">Guardar NIP</button>
        </form>
      )}
    </div>
    <div className="card">
      <h3>Acerca de</h3>
      <div className="row"><span>Negocio</span><span>Donnie's Pizza</span></div>
      <div className="row"><span>Versión</span><span>1.0</span></div>
    </div>
    <div className="card">
      <button className="primary" style={{background:'#555'}} onClick={onLock}>Bloquear app</button>
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

// Registro del service worker: permite que la app cargue y funcione
// sin internet una vez que se visitó al menos una vez estando en línea.
// Se protege con try/catch para que, si el entorno no soporta service
// workers (p. ej. una vista previa restringida), la app no se rompa.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      // Silenciar: si falla el registro, la app sigue funcionando en línea con normalidad.
    });
  });
}

</script>
</body>
</html>
